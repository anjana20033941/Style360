<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting to Sign In — Style360</title>
    <script>
        // Forward to auth.html preserving all query parameters (e.g. ?redirect=try-on)
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        window.location.replace('auth.html' + search + hash);
    </script>
</head>
<body>
</body>
</html>
